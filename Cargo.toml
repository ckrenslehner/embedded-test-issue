[package]
name = "minimal-firmware"
version = "0.1.0"
edition = "2021"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html


[features]
log = ["dep:log", "rtt-target/log", "embedded-test/log"]
defmt = [
  "dep:defmt",
  "dep:panic-probe",
  "embassy-stm32/defmt",
  "embassy-executor/defmt",
  "rtt-target/defmt",
  "embedded-test/defmt",
]

default = ["defmt"]

[[test]]
name = "simple_test"
harness = false

[dependencies]
embassy-stm32 = { version = "0.2", git = "https://github.com/embassy-rs/embassy.git", branch = "main", features = [
  "stm32wb55rg",
    "time-driver-any",
  "memory-x",
] }

embassy-executor = { version = "0.7.0", git = "https://github.com/embassy-rs/embassy.git", branch = "main", features = [
  "arch-cortex-m",
  "executor-thread",
] }

embassy-time = { version = "0.4.0", git = "https://github.com/embassy-rs/embassy.git", branch = "main", features = ["tick-hz-32_768"] }


defmt = { version = "0.3", optional = true }
log = { version = "0.4", optional = true }
panic-probe = { version = "0.3", features = ["print-defmt"], optional = true}

rtt-target = { version = "0.6" }

cortex-m = { version = "0.7", features = [
  "inline-asm",
  "critical-section-single-core",
] }

cortex-m-rt = "0.7.0"


[profile.release]
debug = 2
incremental = false

[dev-dependencies]
embedded-test = { version = "0.6", features = ["embassy", "external-executor"] }
